---
- name: Import Password Policy Schema
  shell:
    cmd: "ldapadd -Q -Y EXTERNAL -H ldapi:/// -f /etc/ldap/schema/ppolicy.ldif && touch {{ openldap_ldifdir }}/ppolicy_schema.ldif.done"
    creates: "{{ openldap_ldifdir }}/ppolicy_schema.ldif.done"

- name: Push Password Policy overlay LDIF
  template:
    src: ppolicy_overlay.ldif.j2
    dest: "{{ openldap_ldifdir }}/ppolicy_overlay.ldif"

- name: Import Password Policy overlay LDIF
  shell:
    cmd: "ldapadd -Q -Y EXTERNAL -H ldapi:/// -f {{ openldap_ldifdir }}/ppolicy_overlay.ldif && touch {{ openldap_ldifdir }}/ppolicy_overlay.ldif.done"
    creates: "{{ openldap_ldifdir }}/ppolicy_overlay.ldif.done"

- name: Push Password Policy default LDIF
  template:
    src: ppolicy_default.ldif.j2
    dest: "{{ openldap_ldifdir }}/ppolicy_default.ldif"

- name: Import Password Policy default LDIF
  shell:
    cmd: "ldapadd -x -w {{ ansible_ldapauth_password }} -D cn=admin,{{ ansible_ldapauth_rootdn }} -H ldap:// -f {{ openldap_ldifdir }}/ppolicy_default.ldif && touch {{ openldap_ldifdir }}/ppolicy_default.ldif.done"
    creates: "{{ openldap_ldifdir }}/ppolicy_default.ldif.done"


