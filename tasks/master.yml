---
- name: Create accesslog directory
  file:
    path: "{{ openldap_accesslog }}"
    state: directory
    mode: 0700
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"

- name: Configure DB_CONFIG defaults
  copy:
    src: DB_CONFIG
    dest: "{{ openldap_accesslog }}"
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    mode: 0755

- name: Create ldif directory
  file:
    path: "{{ openldap_ldifdir }}"
    state: directory
    mode: 0700
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"

- name: Push provider LDIF
  template:
    src: provider.ldif.j2
    dest: "{{ openldap_ldifdir }}/provider.ldif"

- name: Debug
  debug:
    msg: "ldapadd -Q -Y EXTERNAL -H ldapi:/// -f {{ openldap_ldifdir }}/provider.ldif && touch {{ openldap_ldifdir }}/provider.ldif.done"

- name: Import LDIF provider
  shell:
    cmd: "ldapadd -Q -Y EXTERNAL -H ldapi:/// -f {{ openldap_ldifdir }}/provider.ldif && touch {{ openldap_ldifdir }}/provider.ldif.done"
    creates: "{{ openldap_ldifdir }}/provider.ldif.done"

