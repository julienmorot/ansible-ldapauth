---
- name: Debconf OpenLDAP
  debconf:
    name: slapd
    question: "{{ item.question }}"
    vtype: "{{ item.vtype }}"
    value: "{{ item.value }}"
  with_items:
    - question: "shared/organization"
      vtype: string
      value: "{{ ansible_ldapauth_basedn }}"
    - question: "slapd/domain"
      vtype: string
      value: "{{ ansible_ldapauth_domain }}"
    - question: "slapd/password1"
      vtype: string
      value: "{{ ansible_ldapauth_password }}"
    - question: "slapd/password2"
      vtype: string
      value: "{{ ansible_ldapauth_password }}"
- name: Install OpenLDAP
  apt:
    update_cache: yes
    state: present
    force_apt_get: yes
    pkg:
      - ldap-utils
      - slapd
