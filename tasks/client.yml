---
- name: Debconf LIBNSS-LDAP
  debconf:
    name: slapd
    question: "{{ item.question }}"
    vtype: "{{ item.vtype }}"
    value: "{{ item.value }}"
  with_items:
    - question: "ldap-auth-config/ldapns/ldap-server"
      vtype: string
      value: "{{ ansible_ldapauth_ldapurl }}"
    - question: "ldap-auth-config/ldapns/base-dn"
      vtype: string
      value: "{{ ansible_ldapauth_rootdn }}"

- name: Install PAM/NSS
  apt:
    update_cache: yes
    state: present
    force_apt_get: yes
    pkg:
      - libpam-modules
      - libnss-ldap
      - libpam-ldap
      - ldap-auth-config

- name: Configure NSS to use LDAP services
  lineinfile:
    dest: /etc/nsswitch.conf
    regexp: "^passwd:"
    line: "passwd:         compat ldap systemd"

- name: Configure NSS to use LDAP services
  lineinfile:
    dest: /etc/nsswitch.conf
    regexp: "^group:"
    line: "group:         compat ldap systemd"

- name: Configure NSS to use LDAP services
  lineinfile:
    dest: /etc/nsswitch.conf
    regexp: "^shadow:"
    line: "shadow:         compat ldap systemd"

